name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hrms
          POSTGRES_PASSWORD: hrms_test_password
          POSTGRES_DB: hrms_ats_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://hrms:hrms_test_password@localhost:5432/hrms_ats_test?schema=public
      JWT_ACCESS_SECRET: ci-test-access-secret-change-me
      JWT_REFRESH_SECRET: ci-test-refresh-secret-change-me
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4000/api/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install workspace dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npm run prisma:generate --workspace backend
      - name: Run database migrations
        run: npm run prisma:deploy --workspace backend
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Backend unit tests
        run: npm test --workspace backend -- --ci
